<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Bowhunting Newsletter{% endblock %}</title>
  <link rel="stylesheet" href="/static/newsletter/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <p class="site-title"><a href="{% url 'newsletter:home' %}">Bowhunting Newsletter</a></p>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>State-by-state bowhunting law, land, and disease updates — once a week.</p>
  </footer>
</body>
</html>
